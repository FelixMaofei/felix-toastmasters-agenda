<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#173746" flood-opacity="0.09"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#C89B2B"/></marker>
    <style>
      .title{font:800 40px 'PingFang SC','Noto Sans SC',sans-serif;fill:#073B57}.sub{font:500 19px 'PingFang SC','Noto Sans SC',sans-serif;fill:#647681}
      .root{font:800 25px 'PingFang SC','Noto Sans SC',sans-serif;fill:white;text-anchor:middle}.col{font:800 23px 'PingFang SC','Noto Sans SC',sans-serif;fill:#073B57}.colsub{font:500 15px 'PingFang SC','Noto Sans SC',sans-serif;fill:#6B7B84}
      .file{font:750 19px 'PingFang SC','Noto Sans SC',sans-serif;fill:#073B57}.desc{font:500 15px 'PingFang SC','Noto Sans SC',sans-serif;fill:#536570}.mini{font:500 14px 'PingFang SC','Noto Sans SC',sans-serif;fill:#6B7B84}
      .foothead{font:800 19px 'PingFang SC','Noto Sans SC',sans-serif;fill:#772432}.foot{font:550 16px 'PingFang SC','Noto Sans SC',sans-serif;fill:#294653}
      .arrow{stroke:#C89B2B;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#F7F5F0"/>
  <rect x="0" y="0" width="1110" height="10" fill="#004165"/><rect x="1110" y="0" width="300" height="10" fill="#D5AA32"/><rect x="1410" y="0" width="390" height="10" fill="#772432"/>
  <text x="65" y="67" class="title">Felix Toastmasters Agenda｜项目文件架构</text>
  <text x="65" y="104" class="sub">同一个项目分成：Agent 日常运行、Git 维护与公开检查、项目外部的私有资料</text>

  <g filter="url(#shadow)">
    <rect x="560" y="135" width="680" height="72" rx="20" fill="#004165"/>
    <text x="900" y="179" class="root">felix-toastmasters-agenda/</text>
  </g>
  <path d="M900 208V230H320V248" class="arrow"/><path d="M900 208V248" class="arrow"/><path d="M900 208V230H1515V248" class="arrow"/>

  <rect x="45" y="250" width="550" height="680" rx="25" fill="#EAF2F5" stroke="#AFC5CE" stroke-width="2"/>
  <text x="75" y="292" class="col">① 统一运行包</text><text x="75" y="320" class="colsub">安装到 Codex / WorkBuddy / 豆包，普通任务真正使用</text>
  <g filter="url(#shadow)">
    <rect x="75" y="345" width="490" height="90" rx="16" fill="#FFFFFF"/>
    <text x="98" y="378" class="file">SKILL.md</text><text x="98" y="407" class="desc">Agent 每次读取：怎样沟通、确认文字、生图、修改和交付</text>
    <rect x="75" y="452" width="490" height="78" rx="16" fill="#FFFFFF"/>
    <text x="98" y="483" class="file">agents/openai.yaml</text><text x="98" y="510" class="desc">Codex 显示名称、简介、默认提示词与自动触发策略</text>
    <rect x="75" y="547" width="490" height="220" rx="16" fill="#FFFFFF"/>
    <text x="98" y="579" class="file">scripts/｜5个运行程序</text>
    <text x="98" y="610" class="desc"><tspan x="98">run_agenda.py　总入口：confirm / image / final / profile反馈</tspan><tspan x="98" dy="27">simple_input.py　角色别名、简易输入与缺项检查</tspan><tspan x="98" dy="27">build_agenda.py　流程、顺序、时间、串场与Profile合并</tspan><tspan x="98" dy="27">agenda_renderer.py　唯一会单排版器</tspan><tspan x="98" dy="27">export_a4.py　Chrome导出及一页A4检查</tspan></text>
    <rect x="75" y="784" width="490" height="118" rx="16" fill="#FFFFFF"/>
    <text x="98" y="817" class="file">assets/ + profiles/｜离线资源</text>
    <text x="98" y="848" class="desc"><tspan x="98">CSS、官方 Logo、离线字体与许可证</tspan><tspan x="98" dy="27">profiles/　经授权公开的内置俱乐部资料</tspan></text>
  </g>

  <rect x="625" y="250" width="665" height="680" rx="25" fill="#F0F3F4" stroke="#C8D3D7" stroke-width="2"/>
  <text x="655" y="292" class="col">② Git 仓库维护资料</text><text x="655" y="320" class="colsub">会上传 Git，但普通会单不会读取；用于维护、教学和公开检查</text>
  <g filter="url(#shadow)">
    <rect x="655" y="345" width="605" height="82" rx="16" fill="#FFFFFF"/>
    <text x="678" y="376" class="file">README.md</text><text x="678" y="404" class="desc">面向人的项目说明、安装方式、Profile价值与Git收录范围</text>
    <rect x="655" y="443" width="605" height="82" rx="16" fill="#FFFFFF"/>
    <text x="678" y="474" class="file">references/input-contract.md</text><text x="678" y="502" class="desc">复杂字段手册；只有输入表达不清楚时才按需读取</text>
    <rect x="655" y="541" width="605" height="120" rx="16" fill="#FFFFFF"/>
    <text x="678" y="572" class="file">docs/</text><text x="678" y="600" class="desc"><tspan x="678">architecture.md　文字架构说明</tspan><tspan x="678" dy="25">runtime-flow.*　运行流程图　　project-structure.*　文件架构图</tspan></text>
    <text x="678" y="650" class="desc">skill-instruction-architecture.*　SKILL.md 指令架构图</text>
    <rect x="655" y="677" width="605" height="118" rx="16" fill="#FFFFFF"/>
    <text x="678" y="708" class="file">examples/</text><text x="678" y="736" class="desc"><tspan x="678">meeting.fixture.json　测试夹具，不是用户范本</tspan><tspan x="678" dy="25">mingyuan-ai-lab/　匿名完整示例：Profile、输入、文字稿、PNG/PDF</tspan></text>
    <rect x="655" y="811" width="605" height="91" rx="16" fill="#FFFFFF"/>
    <text x="678" y="842" class="file">tests/　package_local.py　.gitignore</text><text x="678" y="870" class="desc"><tspan x="678">回归测试固定业务底线；打包脚本只从白名单制作安装包</tspan></text>
  </g>

  <rect x="1320" y="250" width="435" height="680" rx="25" fill="#FFF2F3" stroke="#D7B7BD" stroke-width="2"/>
  <text x="1350" y="292" class="col">③ 项目文件夹之外</text><text x="1350" y="320" class="colsub">不上传 Git，也不放进统一运行包</text>
  <g filter="url(#shadow)">
    <rect x="1350" y="345" width="375" height="124" rx="16" fill="#FFFFFF"/>
    <text x="1373" y="378" class="file">用户本机私有 Profile</text><text x="1373" y="407" class="desc"><tspan x="1373">~/.toastmasters-agenda/profiles/</tspan><tspan x="1373" dy="25">未授权公开或用户自定义的俱乐部资料</tspan></text>
    <rect x="1350" y="486" width="375" height="105" rx="16" fill="#FFFFFF"/>
    <text x="1373" y="519" class="file">独立验证集</text><text x="1373" y="548" class="desc"><tspan x="1373">felix-toastmasters-agenda-evals/</tspan><tspan x="1373" dy="25">跨版本真实场景比较，不污染Skill源码</tspan></text>
    <rect x="1350" y="608" width="375" height="105" rx="16" fill="#FFFFFF"/>
    <text x="1373" y="641" class="file">V3教学归档</text><text x="1373" y="670" class="desc"><tspan x="1373">保存设计演进、旧视觉和失败版本</tspan><tspan x="1373" dy="25">不进入当前运行包</tspan></text>
    <rect x="1350" y="730" width="375" height="172" rx="16" fill="#FFFFFF"/>
    <text x="1373" y="763" class="file">本地生成与发布产物</text><text x="1373" y="792" class="desc"><tspan x="1373">每期 meeting.json、文字稿、预览与最终文件</tspan><tspan x="1373" dy="25">v4.2-runtime/ 安装目录</tspan><tspan x="1373" dy="25">发布 ZIP 只作为 GitHub Release 附件</tspan><tspan x="1373" dy="25">不作为源码提交</tspan></text>
  </g>

  <rect x="45" y="965" width="1710" height="92" rx="20" fill="#FFFFFF" stroke="#D7DEE1"/>
  <text x="72" y="999" class="foothead">最终上传 Git = ① 的源码与资源 + ② 的维护资料</text>
  <text x="72" y="1032" class="foot">安装包只从①制作；③始终留在本地。授权公开的资料可复用，私有资料和历史噪音不进入日常运行包。</text>
</svg>
