<style>

  --navy-panel: #00294f;
  --navy-panel-2: #063a69;

  --gold-text: #a9660b;
  --gold-line: #e2b559;
  --gold-light: #f0d08b;
  --burgundy: #7a0718;
  --burgundy-soft: #fae9eb;
  --ink: #0c2c51;
  --text: #1e2732;
  --muted: #657183;
  --grid-line: #bec8d3;
  --section-bg: #f3f5f7;

  --yellow: #d78a00;
  --red: #b01224;

}
html, body {

  width: 100%;
  min-height: 100%;
  background: #e7ebef;
  color: var(--text);
  font-family: var(--font);
  font-synthesis: none;

  -webkit-font-smoothing: antialiased;
}
body { display: flex; justify-content: center; }
.page {

  height: 297mm;

  display: grid;

}
.hero, .meta-strip, .main-grid, .support-grid, .rule-separator { margin-inline: 5.5mm; }
.hero {

  gap: 3mm;
  align-items: center;
  overflow: hidden;
}
.brand-logo {

  height: 38mm;

}

}

}
.theme-title {

  font-weight: 700;

}
.theme-art {

.theme-pattern {

<script id="agenda-audit-result" type="application/json"></script>
<script>
(() => {
  const one = (selector) => document.querySelector(selector);
  const all = (selector) => [...document.querySelectorAll(selector)];
  const report = { ok: true, failures: [], measurements: {} };
  const fail = (code, detail) => {
    report.ok = false;
    report.failures.push({ code, detail });
  };
  const box = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.x, y: r.y, width: r.width, height: r.height, right: r.right, bottom: r.bottom };
  };
  const selectors = [
    ".page", ".hero", ".hero-copy", ".theme-title",
    ".meta-strip", ".main-grid", ".sidebar", ".agenda-panel", ".agenda-table",
    ".support-grid", ".footer",
    ".sidebar > .panel", ".sidebar .backstage-list", ".sidebar .timer-body",
    ".sidebar .officer-list", ".support-panel", ".support-body"
  ];
  const inspect = () => {
    report.ok = true;
    report.failures = [];
    report.measurements = {};
    try {
    selectors.forEach((selector) => {
      all(selector).forEach((el, index) => {
        const dx = el.scrollWidth - el.clientWidth;
        const dy = el.scrollHeight - el.clientHeight;
        if (dx > 1 || dy > 1) {
          fail("overflow", selector + "[" + index + "] x=" + dx + " y=" + dy);
        }
      });
    });

    [".club-name", ".meeting-title", ".footer-name", ".footer-slogan", ".footer-values"]
      .forEach((selector) => {
        const el = one(selector);
        if (el && el.scrollWidth > el.clientWidth + 1) {
          fail("single-line-wrap", selector);
        }
      });

    const sidebar = box(one(".sidebar"));
    const agenda = box(one(".agenda-panel"));
    const supports = box(one(".support-grid"));
    report.measurements = { sidebar, agenda, supports, page: box(one(".page")) };
    if (Math.abs(sidebar.y - agenda.y) > 1 || Math.abs(sidebar.bottom - agenda.bottom) > 1) {
      fail("main-edge-misalignment", { sidebar, agenda });
    }

    [".agenda-table td", ".backstage-row", ".officer-row", ".support-body", ".timer-signals"]
      .forEach((selector) => {
        all(selector).forEach((el, index) => {
          const px = parseFloat(getComputedStyle(el).fontSize);
          if (px < 7.1) fail("font-too-small", selector + "[" + index + "] " + px + "px");
        });
      });

    const lineWidths = (el) => {
      const range = document.createRange();
      range.selectNodeContents(el);
      const rects = [...range.getClientRects()].filter((r) => r.width > 1 && r.height > 1);
      const lines = [];
      rects.forEach((r) => {
        let line = lines.find((item) => Math.abs(item.y - r.y) < 1.5);
        if (!line) {
          line = { y: r.y, left: r.left, right: r.right };
          lines.push(line);
        } else {
          line.left = Math.min(line.left, r.left);
          line.right = Math.max(line.right, r.right);
        }
      });
      return lines.sort((a, b) => a.y - b.y).map((line) => line.right - line.left);
    };
    all(".support-body p, .club-facts span, .meta-copy span").forEach((el, index) => {
      const widths = lineWidths(el);
      if (widths.length > 1) {
        const previous = widths[widths.length - 2];
        const last = widths[widths.length - 1];
        if (last < Math.min(26, previous * .22)) {
          fail("orphan-line", "text[" + index + "] last=" + last.toFixed(1) + " previous=" + previous.toFixed(1));
        }
      }
    });

    } catch (error) {
      fail("audit-runtime", error && error.stack ? error.stack : String(error));
    }
    const output = one("#agenda-audit-result");
    if (output) output.textContent = JSON.stringify(report);
    document.documentElement.dataset.agendaAudit = report.ok ? "ok" : "failed";
  };
  inspect();
  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(() => requestAnimationFrame(inspect));
})();
</script>
</body>
</html>
