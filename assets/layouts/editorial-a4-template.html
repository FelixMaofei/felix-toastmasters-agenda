<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="agenda-page-count" content="1">
<meta name="agenda-visual-audit" content="required">
<title>{{DOCUMENT_TITLE}}</title>
<style>
{{FONT_CSS}}
@page { size: A4 portrait; margin: 0; }
* { box-sizing: border-box; }
:root {
  --paper: #fdfcf9;
  --surface: #ffffff;
  --navy-title: #062b5b;
  --navy-panel: #002d58;
  --navy-panel-2: #0a477b;
  --navy-footer: #00315f;
  --gold-text: #ad6809;
  --gold-line: #dda82f;
  --gold-light: #f2cc69;
  --burgundy: #8d061b;
  --burgundy-soft: #fae8eb;
  --ink: #0c2c51;
  --text: #1e2732;
  --muted: #657183;
  --grid-line: #aebdcb;
  --section-bg: #f1f3f5;
  --green: #0b8d3d;
  --yellow: #d78a00;
  --red: #b01224;
  --radius: 1.65mm;
  --shadow: 0 .45mm 1.55mm rgba(0, 40, 78, .12);
  --font: "Felix Agenda Sans", "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}
html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #e7ebef;
  color: var(--text);
  font-family: var(--font);
  font-synthesis: none;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
}
body { display: flex; justify-content: center; }
.page {
  position: relative;
  width: 210mm;
  height: 297mm;
  overflow: hidden;
  display: grid;
  grid-template-rows: 43mm 19mm 3mm 164mm 3mm 43mm 4mm 18mm;
  background:
    linear-gradient(145deg, rgba(229,188,93,.025), transparent 33%),
    var(--paper);
  box-shadow: 0 3mm 12mm rgba(18, 42, 65, .14);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.hero, .meta-strip, .main-grid, .support-grid, .rule-separator { margin-inline: 5.5mm; }
.hero {
  position: relative;
  display: grid;
  grid-template-columns: 42mm minmax(0, 1fr) 42mm;
  gap: 3mm;
  align-items: center;
  overflow: hidden;
}
.brand-logo {
  position: relative;
  z-index: 3;
  width: 38mm;
  height: 38mm;
  object-fit: contain;
  justify-self: center;
}
.hero-copy {
  position: relative;
  z-index: 3;
  align-self: center;
  padding-top: 2.2mm;
}
.club-name {
  color: var(--navy-title);
  font-size: 5.75mm;
  line-height: 1.18;
  font-weight: 800;
  letter-spacing: .28mm;
  white-space: nowrap;
}
.meeting-title {
  margin-top: 2.25mm;
  color: var(--navy-title);
  font-size: 10.8mm;
  line-height: 1.15;
  font-weight: 900;
  letter-spacing: -.2mm;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.meeting-title em {
  color: var(--burgundy);
  font-style: normal;
}
.theme-title {
  margin-top: 3.25mm;
  display: grid;
  grid-template-columns: 16mm auto minmax(8mm, 1fr);
  gap: 2.5mm;
  align-items: center;
  color: var(--gold-text);
  font-size: 4.6mm;
  font-weight: 700;
  letter-spacing: .45mm;
  white-space: nowrap;
}
.theme-title::before,
.theme-title::after {
  content: "";
  height: .35mm;
  background: var(--gold-line);
}
.theme-art {
  position: absolute;
  z-index: 1;
  right: 0;
  top: 0;
  width: 64mm;
  height: 43mm;
  object-fit: contain;
  object-position: right center;
  opacity: .48;
  pointer-events: none;
}
.name-long .club-name { font-size: 5.15mm; letter-spacing: .16mm; }
.name-xlong .club-name { font-size: 4.55mm; letter-spacing: .08mm; }
.name-xxlong .club-name { font-size: 3.85mm; letter-spacing: .03mm; }
.name-long .footer-name { font-size: 3.6mm; letter-spacing: .18mm; }
.name-xlong .footer-name { font-size: 3.2mm; letter-spacing: .1mm; }
.name-xxlong .footer-name { font-size: 2.85mm; letter-spacing: .04mm; }
.language-en .hero {
  grid-template-columns: 38mm minmax(0, 1fr) 30mm;
  gap: 2.5mm;
}
.language-en .brand-logo { width: 35mm; height: 35mm; }
.language-en .club-name {
  font-size: 4.45mm;
  line-height: 1.12;
  letter-spacing: .02mm;
}
.language-en.name-long .club-name { font-size: 3.95mm; }
.language-en.name-xlong .club-name { font-size: 3.45mm; }
.language-en .meeting-title {
  margin-top: 2.7mm;
  font-size: 7.8mm;
  letter-spacing: -.12mm;
}
.language-en .theme-title {
  margin-top: 3.5mm;
  grid-template-columns: 10mm auto minmax(6mm, 1fr);
  gap: 1.5mm;
  font-size: 3.35mm;
  letter-spacing: .02mm;
}
.language-en .theme-art,
.language-en .theme-pattern { width: 51mm; opacity: .34; }
.language-en .meta-strip {
  grid-template-columns: 1fr .82fr 1.35fr 1fr .83fr;
}
.language-en .meta-copy b { font-size: 2.55mm; }
.language-en .meta-copy span { font-size: 2.3mm; line-height: 1.16; }
.language-en .meta-item.word .meta-copy span { font-size: 2.8mm; }
.language-en .panel-head { font-size: 3.45mm; }
.language-en .footer-name { font-size: 3.35mm; letter-spacing: .04mm; }
.language-en.name-long .footer-name { font-size: 3mm; }
.language-en.name-xlong .footer-name { font-size: 2.7mm; }
.language-en .footer-slogan { font-size: 2.35mm; }
.language-en .footer-values { font-size: 3.15mm; letter-spacing: .12mm; }
.theme-pattern {
  position: absolute;
  z-index: 1;
  right: 0;
  top: 0;
  width: 64mm;
  height: 43mm;
  opacity: .26;
  pointer-events: none;
}
.visual-general .theme-pattern {
  background: repeating-radial-gradient(circle at 88% 42%, transparent 0 6mm, rgba(3,34,76,.18) 6.2mm 6.5mm, transparent 6.8mm 12mm);
}
.visual-technology .theme-pattern {
  background:
    radial-gradient(circle at 82% 30%, rgba(226,181,89,.8) 0 1mm, transparent 1.2mm),
    radial-gradient(circle at 55% 58%, rgba(3,34,76,.55) 0 .8mm, transparent 1mm),
    repeating-linear-gradient(0deg, transparent 0 7mm, rgba(3,34,76,.16) 7.2mm 7.5mm),
    repeating-linear-gradient(90deg, transparent 0 9mm, rgba(226,181,89,.18) 9.2mm 9.5mm);
  transform: none;
}
.visual-voice .theme-pattern {
  background: repeating-radial-gradient(ellipse at 92% 48%, transparent 0 4mm, rgba(122,7,24,.23) 4.25mm 4.55mm, transparent 4.8mm 8mm);
}
.visual-wellness .theme-pattern {
  border: .65mm solid rgba(74,112,86,.26);
  border-radius: 70% 0 70% 0;
  transform: rotate(-16deg) scale(.82);
  background: radial-gradient(ellipse at 50% 100%, rgba(87,128,97,.16), transparent 65%);
}
.visual-leadership .theme-pattern {
  background: linear-gradient(135deg, transparent 38%, rgba(122,7,24,.22) 38% 39%, transparent 39% 53%, rgba(226,181,89,.28) 53% 54%, transparent 54%);
}
.visual-celebration .theme-pattern {
  background: radial-gradient(circle, rgba(226,181,89,.58) 0 .8mm, transparent 1mm) 0 0 / 8mm 8mm;
  transform: rotate(10deg);
}
.meta-strip {
  display: grid;
  grid-template-columns: 1.05fr .9fr 1.15fr .9fr .8fr;
  align-items: stretch;
  border-bottom: 0;
}
.meta-item {
  min-width: 0;
  display: grid;
  grid-template-columns: 9.4mm minmax(0, 1fr);
  gap: 1.4mm;
  align-items: center;
  padding: 1mm 2.2mm;
  border-right: .22mm solid #7890aa;
}
.meta-item:first-child { padding-left: 1mm; }
.meta-item:last-child { border-right: 0; padding-right: 1.5mm; }
.meta-item .meta-icon {
  width: 8.2mm;
  height: 8.2mm;
  color: var(--navy-title);
  transform: scale(1.06);
}
.meta-copy { min-width: 0; }
.meta-copy b {
  display: block;
  margin-bottom: .7mm;
  color: var(--ink);
  font-size: 3.08mm;
  line-height: 1;
  font-weight: 800;
}
.meta-copy span {
  display: block;
  color: var(--text);
  font-size: 2.72mm;
  line-height: 1.18;
  text-wrap: balance;
}
.meta-item.word .meta-copy span {
  color: var(--gold-text);
  font-size: 3.45mm;
  font-weight: 800;
}
.rule-separator {
  align-self: center;
  height: .42mm;
  background: var(--gold-line);
}
.main-grid {
  min-height: 0;
  display: grid;
  grid-template-columns: 58.5mm minmax(0, 1fr);
  gap: 3.5mm;
}
.sidebar {
  min-height: 0;
  display: grid;
  grid-template-rows: 38mm 63mm 58mm;
  gap: 2.5mm;
}
.sidebar-2 { grid-template-rows: 46mm 115.5mm; }
.sidebar-1 { grid-template-rows: 1fr; }
.sidebar > .panel { display: flex; flex-direction: column; }
.sidebar > .panel > .panel-head { flex: 0 0 8.4mm; }
.panel {
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: .26mm solid #2d5d8b;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.panel-head {
  margin: 0;
  height: 8.4mm;
  display: flex;
  align-items: center;
  gap: 2mm;
  padding: 0 2.4mm;
  background:
    linear-gradient(180deg, rgba(255,255,255,.10), transparent 48%),
    linear-gradient(118deg, var(--navy-panel-2), var(--navy-panel));
  border-bottom: .42mm solid var(--gold-line);
  color: #fff;
  font-size: 4mm;
  line-height: 1;
  font-weight: 800;
  letter-spacing: .12mm;
}
.panel-head .head-icon { width: 5.2mm; height: 5.2mm; color: var(--gold-light); }
.backstage-list {
  height: auto;
  flex: 1;
  min-height: 0;
  display: grid;
  grid-auto-rows: 1fr;
  padding: .6mm 2mm;
}
.backstage-row {
  display: grid;
  grid-template-columns: 6mm minmax(0, 1fr) 18mm;
  gap: 1.2mm;
  align-items: center;
  border-bottom: .18mm solid #d2d9e0;
  color: var(--ink);
  font-size: 2.72mm;
  font-variant-numeric: tabular-nums;
}
.backstage-row:last-child { border-bottom: 0; }
.backstage-row .row-icon { width: 4.8mm; height: 4.8mm; color: var(--navy-title); }
.backstage-row strong { font-weight: 750; }
.timer-body {
  height: auto;
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-rows: repeat(3, 1fr);
  padding: 1mm 2.2mm;
}
.timer-band {
  display: grid;
  grid-template-columns: 8mm minmax(0, 1fr);
  gap: 1.4mm;
  align-items: center;
  border-bottom: .18mm solid #d4dbe2;
}
.timer-band:last-child { border-bottom: 0; }
.paddle {
  position: relative;
  justify-self: center;
  width: 5mm;
  height: 12mm;
}
.paddle::before {
  content: "";
  position: absolute;
  left: .45mm;
  top: .3mm;
  width: 4mm;
  height: 6.2mm;
  border: .7mm solid currentColor;
  border-radius: .8mm;
  background: #fff;
  box-shadow: inset 0 0 0 .45mm currentColor;
}
.paddle::after {
  content: "";
  position: absolute;
  left: 2.1mm;
  top: 6.6mm;
  width: .8mm;
  height: 5mm;
  background: currentColor;
  border-radius: .4mm;
}
.paddle.green { color: var(--green); }
.paddle.yellow { color: var(--yellow); }
.paddle.red { color: var(--red); }
.timer-copy strong {
  display: block;
  margin-bottom: .8mm;
  font-size: 3.02mm;
  line-height: 1;
}
.timer-band:nth-child(1) .timer-copy strong { color: var(--green); }
.timer-band:nth-child(2) .timer-copy strong { color: var(--yellow); }
.timer-band:nth-child(3) .timer-copy strong { color: var(--red); }
.timer-signals {
  display: flex;
  flex-wrap: wrap;
  gap: .4mm 2mm;
  font-size: 2.18mm;
  line-height: 1.16;
}
.signal { white-space: nowrap; }
.signal::before {
  content: "";
  display: inline-block;
  width: 1.45mm;
  height: 1.45mm;
  margin-right: .7mm;
  border-radius: 50%;
  vertical-align: .05mm;
  background: currentColor;
}
.signal.green { color: var(--green); }
.signal.yellow { color: var(--yellow); }
.signal.red { color: var(--red); }
.signal.bell { color: #303a44; }
.officer-list {
  height: auto;
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-rows: none;
  grid-auto-rows: 1fr;
  padding: .5mm 1.8mm;
}
.officer-row {
  display: grid;
  grid-template-columns: 5.4mm minmax(0, 1fr) 16mm;
  gap: .8mm;
  align-items: center;
  border-bottom: .16mm solid #d3dae1;
  color: var(--ink);
  font-size: 2.42mm;
  line-height: 1;
}
.officer-row:last-child { border-bottom: 0; }
.officer-row .row-icon { width: 4.2mm; height: 4.2mm; color: var(--navy-title); }
.officer-row strong { font-weight: 760; }
.officer-row strong, .officer-row span { white-space: nowrap; }
.agenda-panel {
  display: flex;
  flex-direction: column;
}
.agenda-head {
  height: 8.4mm;
  flex: 0 0 8.4mm;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2.5mm;
  background:
    linear-gradient(180deg, rgba(255,255,255,.10), transparent 48%),
    linear-gradient(118deg, var(--navy-panel-2), var(--navy-panel));
  border-bottom: .42mm solid var(--gold-line);
  color: #fff;
}
.agenda-head strong {
  display: flex;
  align-items: center;
  gap: 1.7mm;
  font-size: 4.1mm;
}
.agenda-head .head-icon { width: 5mm; height: 5mm; color: var(--gold-light); }
.agenda-head span { color: var(--gold-light); font-size: 2.35mm; font-weight: 700; }
.agenda-table {
  width: 100%;
  height: calc(100% - 8.4mm);
  border-collapse: collapse;
  table-layout: fixed;
}
.agenda-table col.time { width: 16%; }
.agenda-table col.item { width: 37%; }
.agenda-table col.owner { width: 24.5%; }
.agenda-table col.duration { width: 22.5%; }
.agenda-table th {
  height: 7mm;
  padding: .6mm 1.2mm;
  border-right: .18mm solid #b9c4cf;
  border-bottom: .22mm solid #7d91a6;
  color: var(--ink);
  background: #f7f8fa;
  font-size: 2.68mm;
  font-weight: 800;
  text-align: center;
}
.agenda-table th:last-child { border-right: 0; }
.agenda-table td {
  height: 5.85mm;
  padding: .5mm 1.2mm;
  border-right: .18mm solid #c7d0d9;
  border-bottom: .16mm solid #c7d0d9;
  color: var(--text);
  font-size: 2.62mm;
  line-height: 1.08;
  text-align: center;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.agenda-table td:last-child { border-right: 0; }
.agenda-table tr:last-child td { border-bottom: 0; }
.owner-align-left .agenda-table th:nth-child(3),
.owner-align-left .agenda-table td:nth-child(3) { text-align: left; }
.owner-align-center .agenda-table th:nth-child(3),
.owner-align-center .agenda-table td:nth-child(3) { text-align: center; }
.phase-row td {
  height: 8.15mm;
  padding: .65mm 1.3mm;
  background: var(--section-bg);
  color: var(--ink);
  font-size: 3.52mm;
  font-weight: 850;
  text-align: left;
}
.phase-row .phase-wrap {
  display: flex;
  align-items: center;
  gap: 1.8mm;
}
.phase-badge {
  width: 6.2mm;
  height: 6.2mm;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--burgundy);
  color: #fff;
}
.phase-badge .phase-icon { width: 3.5mm; height: 3.5mm; }
.phase-range {
  margin-left: 4.5mm;
  color: var(--ink);
  font-size: 2.82mm;
  font-weight: 700;
}
.agenda-table .time-cell { color: var(--ink); font-weight: 700; }
.agenda-table .item-cell { color: var(--ink); font-weight: 600; }
.agenda-table .item-detail { color: var(--muted); font-size: .86em; font-weight: 450; }
.language-en .agenda-table td.item-cell {
  white-space: normal;
  line-height: 1.02;
  padding-inline: 1mm;
}
.language-en .agenda-table .item-detail {
  display: block;
  margin-top: .08mm;
  font-size: .78em;
  line-height: 1.05;
}
.agenda-table .featured td {
  background: var(--burgundy-soft);
  color: var(--burgundy);
  font-weight: 800;
}
.agenda-table .closing-line td {
  color: var(--green);
  font-weight: 800;
}
.agenda-table.density-compact td {
  height: 4.55mm;
  padding-block: .28mm;
  font-size: 2.22mm;
}
.agenda-table.density-compact .phase-row td {
  height: 6.35mm;
  font-size: 2.82mm;
}
.agenda-table.density-compact .phase-badge { width: 4.95mm; height: 4.95mm; }
.agenda-table.density-compact .phase-range { font-size: 2.3mm; }
.language-en .agenda-table.density-compact td.item-cell { font-size: 1.95mm; }
.language-en .agenda-table.density-compact tr.has-detail td { height: 5mm; }
.language-en .agenda-table.density-compact tr:not(.phase-row):not(.has-detail) td { height: 4.35mm; }
.agenda-table.density-ultra td {
  height: 4mm;
  padding-block: .16mm;
  font-size: 2.02mm;
}
.agenda-table.density-ultra .phase-row td {
  height: 5.45mm;
  font-size: 2.52mm;
}
.agenda-table.density-ultra .phase-badge { width: 4.2mm; height: 4.2mm; }
.agenda-table.density-ultra .phase-range { font-size: 2mm; }
.language-en .agenda-table.density-ultra td.item-cell { font-size: 1.82mm; }
.language-en .agenda-table.density-ultra tr.has-detail td { height: 4.55mm; }
.language-en .agenda-table.density-ultra tr:not(.phase-row):not(.has-detail) td { height: 3.7mm; }
.text-size-large .meta-copy span { font-size: 2.82mm; }
.text-size-large .meta-item.word .meta-copy span { font-size: 3.58mm; }
.text-size-large .agenda-table.density-normal td { font-size: 2.72mm; }
.text-size-large .agenda-table.density-compact td { font-size: 2.3mm; }
.text-size-large .agenda-table.density-ultra td { font-size: 2.08mm; }
.text-size-large .support-body { font-size: 2.3mm; }
.text-size-large .backstage-row,
.text-size-large .officer-row { font-size: 2.5mm; }
.text-size-compact .meta-copy span { font-size: 2.55mm; }
.text-size-compact .agenda-table.density-normal td { font-size: 2.42mm; }
.text-size-compact .support-body { font-size: 2.05mm; }
.support-grid {
  display: grid;
  grid-template-columns: 1.18fr 1.02fr .72fr 1.32fr;
  gap: 2mm;
}
.support-count-1 { grid-template-columns: 1fr; }
.support-count-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.support-count-3 { grid-template-columns: 1.08fr .86fr 1.25fr; }
.support-count-1 .support-body,
.support-count-2 .support-body {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.support-count-1 .support-body {
  padding-inline: 8mm;
  font-size: 2.75mm;
  line-height: 1.42;
}
.support-count-2 .support-body {
  padding-inline: 4mm;
  font-size: 2.5mm;
  line-height: 1.4;
}
.support-count-2 .support-body li + li { margin-top: 1.35mm; }
.support-count-3 .support-body { font-size: 2.28mm; }
.support-panel .panel-head {
  height: 8.4mm;
  padding-inline: 2mm;
  font-size: 3.42mm;
}
.support-panel .panel-head .head-icon { width: 4.75mm; height: 4.75mm; }
.support-body {
  height: calc(100% - 8.4mm);
  padding: 1.75mm 2.15mm 2.15mm;
  color: var(--text);
  font-size: 2.2mm;
  line-height: 1.3;
  line-break: strict;
  word-break: normal;
}
.support-body p { margin: 0; }
.keep-together { white-space: nowrap; }
.support-body p,
.support-body li,
.club-facts span { text-wrap: pretty; }
.support-body ul { margin: 0; padding-left: 3.4mm; }
.support-body li + li { margin-top: .8mm; }
.support-body .site-link {
  display: block;
  margin-top: 1.3mm;
  color: #0b57a3;
  font-weight: 750;
}
.club-facts {
  display: grid;
  gap: .35mm;
}
.club-facts div {
  display: grid;
  grid-template-columns: 4.3mm max-content minmax(0, 1fr);
  gap: .8mm;
  align-items: start;
}
.club-facts .fact-icon {
  width: 3.5mm;
  height: 3.5mm;
  margin-top: .1mm;
  color: var(--navy-title);
}
.club-facts strong { color: var(--ink); white-space: nowrap; }
.footer {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 8mm;
  align-items: center;
  padding: 1.25mm 8.5mm;
  background:
    linear-gradient(110deg, rgba(255,255,255,.035), transparent 44%),
    var(--navy-footer);
  color: #fff;
  border-top: .55mm solid var(--gold-line);
}
.footer-brand {
  min-width: 0;
  display: grid;
  grid-template-columns: 13.2mm minmax(0, 1fr);
  gap: 2.6mm;
  align-items: center;
}
.mic-mark {
  width: 11.8mm;
  height: 11.8mm;
  display: grid;
  place-items: center;
  border: .55mm solid var(--gold-light);
  border-radius: 50%;
  color: var(--gold-light);
  box-shadow: 0 0 0 .4mm rgba(240,208,139,.22);
}
.mic-mark .footer-icon { width: 7mm; height: 7mm; }
.footer-name {
  color: var(--gold-light);
  font-size: 4.05mm;
  font-weight: 850;
  letter-spacing: .35mm;
  white-space: nowrap;
}
.footer-slogan {
  margin-top: .65mm;
  font-size: 2.65mm;
  font-weight: 650;
  white-space: nowrap;
}
.footer-values {
  position: relative;
  color: var(--gold-light);
  font-size: 3.62mm;
  line-height: 1;
  font-weight: 700;
  text-align: center;
  letter-spacing: .4mm;
  white-space: nowrap;
}
.footer-values::before,
.footer-values::after {
  content: "";
  display: block;
  height: .35mm;
  margin: 0 0 1.25mm;
  background: var(--gold-line);
}
.footer-values::after { margin: 1.25mm 0 0; }
.ti {
  display: inline-block;
  width: 1em;
  height: 1em;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
@media print {
  html, body { background: #fff; }
  .page { box-shadow: none; }
}
</style>
</head>
<body>
{{BODY}}
<script id="agenda-audit-result" type="application/json"></script>
<script>
(() => {
  const one = (selector) => document.querySelector(selector);
  const all = (selector) => [...document.querySelectorAll(selector)];
  const report = { ok: true, failures: [], measurements: {} };
  const fail = (code, detail) => {
    report.ok = false;
    report.failures.push({ code, detail });
  };
  const box = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.x, y: r.y, width: r.width, height: r.height, right: r.right, bottom: r.bottom };
  };
  const textRects = (el) => {
    if (!el || !el.textContent.trim()) return [];
    const range = document.createRange();
    range.selectNodeContents(el);
    return [...range.getClientRects()].filter((r) => r.width > 1 && r.height > 1);
  };
  const unionRect = (rects) => {
    if (!rects.length) return null;
    const left = Math.min(...rects.map((r) => r.left));
    const top = Math.min(...rects.map((r) => r.top));
    const right = Math.max(...rects.map((r) => r.right));
    const bottom = Math.max(...rects.map((r) => r.bottom));
    return { left, top, right, bottom, width: right - left, height: bottom - top };
  };
  const textLines = (el) => {
    const lines = [];
    textRects(el).forEach((r) => {
      let line = lines.find((item) => Math.abs(item.y - r.y) < 1.5);
      if (!line) {
        line = { y: r.y, left: r.left, right: r.right };
        lines.push(line);
      } else {
        line.left = Math.min(line.left, r.left);
        line.right = Math.max(line.right, r.right);
      }
    });
    return lines.sort((a, b) => a.y - b.y).map((line) => ({
      ...line,
      width: line.right - line.left,
    }));
  };
  const median = (values) => {
    const sorted = [...values].sort((a, b) => a - b);
    if (!sorted.length) return 0;
    const middle = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
  };
  const supportPanelPenalty = (panel, isEnglish) => {
    const body = panel.querySelector(".support-body");
    if (!body) return 0;
    let penalty = 0;
    const overflowX = Math.max(0, body.scrollWidth - body.clientWidth);
    const overflowY = Math.max(0, body.scrollHeight - body.clientHeight);
    penalty += (overflowX + overflowY) * 12;
    const rules = [
      ["li", 2],
      ["p", 6],
      [".club-facts span", isEnglish ? 3 : 2],
    ];
    rules.forEach(([selector, maximum]) => {
      [...body.querySelectorAll(selector)].forEach((el) => {
        const lines = textLines(el);
        if (lines.length > maximum) penalty += (lines.length - maximum) * 120;
        if (lines.length > 1) {
          const priorMedian = median(lines.slice(0, -1).map((line) => line.width));
          const threshold = Math.min(48, priorMedian * .32);
          const last = lines[lines.length - 1].width;
          if (last < threshold) penalty += (threshold - last) * 2.5;
        }
      });
    });
    const content = unionRect(textRects(body));
    if (content) {
      const outer = body.getBoundingClientRect();
      const bottom = outer.bottom - content.bottom;
      const right = outer.right - content.right;
      if (bottom < 5) penalty += (5 - bottom) * 20;
      if (right < 5.5) penalty += (5.5 - right) * 20;
    }
    return penalty;
  };
  const applySupportWeights = (grid, weights) => {
    grid.style.gridTemplateColumns = weights.map((value) => `${value.toFixed(3)}fr`).join(" ");
  };
  const balanceSupportGrid = () => {
    const grid = one(".support-grid");
    if (!grid) return null;
    const panels = [...grid.querySelectorAll(".support-panel")];
    if (panels.length < 3) return null;
    const seed = (grid.dataset.seedColumns || "")
      .split(/\s+/)
      .map((value) => parseFloat(value))
      .filter((value) => Number.isFinite(value));
    if (seed.length !== panels.length) return null;
    const isEnglish = one(".page")?.classList.contains("language-en");
    const objective = (weights) => {
      applySupportWeights(grid, weights);
      const quality = panels.reduce(
        (total, panel) => total + supportPanelPenalty(panel, isEnglish),
        0
      );
      const regularity = weights.reduce(
        (total, value, index) => total + (value - seed[index]) ** 2,
        0
      );
      return { quality, score: quality * 1000 + regularity };
    };
    let bestWeights = [...seed];
    let best = objective(bestWeights);
    for (const step of [.18, .12, .08, .04, .02]) {
      let changed = true;
      let rounds = 0;
      while (changed && rounds < 12) {
        changed = false;
        rounds += 1;
        let nextWeights = bestWeights;
        let next = best;
        for (let receiver = 0; receiver < panels.length; receiver += 1) {
          for (let donor = 0; donor < panels.length; donor += 1) {
            if (receiver === donor || bestWeights[donor] - step < .62 || bestWeights[receiver] + step > 1.62) continue;
            const candidate = [...bestWeights];
            candidate[receiver] += step;
            candidate[donor] -= step;
            const result = objective(candidate);
            if (result.score + .0001 < next.score) {
              nextWeights = candidate;
              next = result;
              changed = true;
            }
          }
        }
        if (changed) {
          bestWeights = nextWeights;
          best = next;
        }
      }
    }
    applySupportWeights(grid, bestWeights);
    return {
      quality: Number(best.quality.toFixed(2)),
      columns: bestWeights.map((value) => Number(value.toFixed(3))),
    };
  };
  const selectors = [
    ".page", ".hero", ".hero-copy", ".theme-title",
    ".meta-strip", ".main-grid", ".sidebar", ".agenda-panel", ".agenda-table",
    ".support-grid", ".footer",
    ".sidebar > .panel", ".sidebar .backstage-list", ".sidebar .timer-body",
    ".sidebar .officer-list", ".support-panel", ".support-body"
  ];
  const inspect = () => {
    report.ok = true;
    report.failures = [];
    report.measurements = {};
    try {
    const supportBalance = balanceSupportGrid();
    if (document.fonts) {
      const agendaFaces = [...document.fonts].filter(
        (face) => face.family.replace(/["']/g, "") === "Felix Agenda Sans"
      );
      const allAgendaFacesLoaded = agendaFaces.length > 0
        && agendaFaces.every((face) => face.status === "loaded");
      if (!allAgendaFacesLoaded || !document.fonts.check('16px "Felix Agenda Sans"', '会议 Agenda 123')) {
        fail("font-not-loaded", {
          family: "Felix Agenda Sans",
          faces: agendaFaces.length,
          statuses: agendaFaces.map((face) => face.status),
        });
      }
    }
    selectors.forEach((selector) => {
      all(selector).forEach((el, index) => {
        const dx = el.scrollWidth - el.clientWidth;
        const dy = el.scrollHeight - el.clientHeight;
        if (dx > 1 || dy > 1) {
          fail("overflow", selector + "[" + index + "] x=" + dx + " y=" + dy);
        }
      });
    });

    const assertTextClearance = (container, content, minimums, detail) => {
      const outer = container.getBoundingClientRect();
      const inner = unionRect(textRects(content));
      if (!inner) return;
      const clearance = {
        left: inner.left - outer.left,
        right: outer.right - inner.right,
        top: inner.top - outer.top,
        bottom: outer.bottom - inner.bottom,
      };
      const failed = Object.entries(minimums).some(
        ([side, minimum]) => clearance[side] + .25 < minimum
      );
      if (failed) fail("content-clearance", { detail, clearance, minimums });
    };
    all(".support-body").forEach((el, index) =>
      assertTextClearance(el, el, { left: 5.5, right: 5.5, top: 4, bottom: 5 }, `support-body[${index}]`)
    );
    all(".meta-item").forEach((el, index) => {
      const content = el.querySelector(".meta-copy");
      if (content) {
        assertTextClearance(el, content, { right: 3.5, top: 3, bottom: 3 }, `meta-item[${index}]`);
      }
    });
    all(".agenda-table tbody tr:not(.phase-row) td").forEach((el, index) =>
      assertTextClearance(el, el, { left: 2.5, right: 2.5, top: 1.2, bottom: 1.2 }, `agenda-cell[${index}]`)
    );

    [".club-name", ".meeting-title", ".footer-name", ".footer-slogan", ".footer-values"]
      .forEach((selector) => {
        const el = one(selector);
        if (el && el.scrollWidth > el.clientWidth + 1) {
          fail("single-line-wrap", selector);
        }
      });

    const sidebar = box(one(".sidebar"));
    const agenda = box(one(".agenda-panel"));
    const supports = box(one(".support-grid"));
    report.measurements = { sidebar, agenda, supports, page: box(one(".page")), supportBalance };
    if (Math.abs(sidebar.y - agenda.y) > 1 || Math.abs(sidebar.bottom - agenda.bottom) > 1) {
      fail("main-edge-misalignment", { sidebar, agenda });
    }

    [".agenda-table td", ".backstage-row", ".officer-row", ".support-body", ".timer-signals"]
      .forEach((selector) => {
        all(selector).forEach((el, index) => {
          const px = parseFloat(getComputedStyle(el).fontSize);
          if (px < 7.1) fail("font-too-small", selector + "[" + index + "] " + px + "px");
        });
      });

    const isEnglish = one(".page")?.classList.contains("language-en");
    const lineRules = [
      [".meta-copy span", 2],
      [".support-body li", 2],
      [".support-body p", 6],
      [".club-facts span", isEnglish ? 3 : 2],
    ];
    lineRules.forEach(([selector, maximum]) => {
      all(selector).forEach((el, index) => {
        const lines = textLines(el);
        if (lines.length > maximum) {
          fail("too-many-lines", `${selector}[${index}] lines=${lines.length} max=${maximum}`);
        }
        if (lines.length > 1) {
          const priorMedian = median(lines.slice(0, -1).map((line) => line.width));
          const last = lines[lines.length - 1].width;
          if (last < Math.min(48, priorMedian * .32)) {
            fail(
              "ragged-last-line",
              `${selector}[${index}] last=${last.toFixed(1)} median=${priorMedian.toFixed(1)}`
            );
          }
        }
      });
    });

    all(".club-facts div").forEach((row, index) => {
      const label = row.querySelector("strong");
      const value = row.querySelector("span");
      if (!label || !value || !label.textContent.trim()) return;
      const labelBox = label.getBoundingClientRect();
      const valueBox = value.getBoundingClientRect();
      if (labelBox.right + 2 > valueBox.left) {
        fail("fact-column-collision", { index, gap: valueBox.left - labelBox.right });
      }
    });

    const headers = all(".agenda-table thead th").map((el) => el.getBoundingClientRect());
    all(".agenda-table tbody tr:not(.phase-row)").forEach((row, rowIndex) => {
      [...row.cells].forEach((cell, columnIndex) => {
        const actual = cell.getBoundingClientRect();
        const expected = headers[columnIndex];
        if (expected && (Math.abs(actual.left - expected.left) > .75 || Math.abs(actual.right - expected.right) > .75)) {
          fail("column-edge-misalignment", { row: rowIndex, column: columnIndex });
        }
        const text = unionRect(textRects(cell));
        if (text) {
          const delta = Math.abs((text.top + text.bottom) / 2 - (actual.top + actual.bottom) / 2);
          if (delta > 1.75) fail("text-not-centered", { row: rowIndex, column: columnIndex, delta });
        }
      });
    });

    const supportPanels = all(".support-panel").map((el) => el.getBoundingClientRect());
    if (supportPanels.length > 1) {
      const top = supportPanels[0].top;
      const bottom = supportPanels[0].bottom;
      supportPanels.slice(1).forEach((panel, index) => {
        if (Math.abs(panel.top - top) > 1 || Math.abs(panel.bottom - bottom) > 1) {
          fail("support-edge-misalignment", index + 1);
        }
      });
    }

    const footer = one(".footer");
    const footerBrand = one(".footer-brand");
    const footerValues = one(".footer-values");
    if (footer && footerBrand && footerValues) {
      const brandBox = footerBrand.getBoundingClientRect();
      const valuesBox = footerValues.getBoundingClientRect();
      if (valuesBox.left - brandBox.right < 24) {
        fail("footer-gap", valuesBox.left - brandBox.right);
      }
      assertTextClearance(footer, footerBrand, { left: 5, top: 4, bottom: 4 }, "footer-brand");
      assertTextClearance(footer, footerValues, { right: 5, top: 4, bottom: 4 }, "footer-values");
    }

    const assertLineHeight = (selector, minimum, maximum) => {
      all(selector).forEach((el, index) => {
        const style = getComputedStyle(el);
        const fontSize = parseFloat(style.fontSize);
        const lineHeight = parseFloat(style.lineHeight);
        if (!fontSize || !lineHeight) return;
        const ratio = lineHeight / fontSize;
        if (ratio < minimum || ratio > maximum) {
          fail("line-height", `${selector}[${index}] ratio=${ratio.toFixed(2)}`);
        }
      });
    };
    assertLineHeight(".support-body", 1.18, 1.55);
    assertLineHeight(".meta-copy span", 1.15, 1.45);
    assertLineHeight(".agenda-table td", 1, 1.3);

    } catch (error) {
      fail("audit-runtime", error && error.stack ? error.stack : String(error));
    }
    const output = one("#agenda-audit-result");
    if (output) output.textContent = JSON.stringify(report);
    document.documentElement.dataset.agendaAudit = report.ok ? "ok" : "failed";
  };
  inspect();
  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  ready.then(inspect);
})();
</script>
</body>
</html>
